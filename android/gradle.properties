# Keep enough headroom for Gradle, Kotlin, and the IDE instead of allowing
# the daemon to consume nearly all available system memory.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
#
# It stays `false` on purpose: with AGP 9's built-in Kotlin, Flutter can no
# longer apply the Kotlin plugin to the plugin sub-projects and prints
#
#   Applying the Kotlin Android Plugin (KGP) was unsuccessful. KGP was not
#   found on the classpath.
#
# for every single plugin instead. With the flag off, Flutter applies KGP
# itself and the build stays quiet.
#
# No plugin in this project declares KGP any more (see pubspec.yaml), so the
# warning
#
#   WARNING: Your app uses the following plugins that apply Kotlin Gradle
#   Plugin (KGP): ...
#
# is gone as well.
android.builtInKotlin=false
